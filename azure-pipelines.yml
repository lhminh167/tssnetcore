# Variable Group 'tssnetcore-env-vars' was defined in the Variables tab
variables:
- name: BuildParameters.RestoreBuildProjects
  value: '**/*.csproj'
- name: BuildParameters.TestProjects
  value: '**/*[Tt]ests/*.csproj'
name: $(date:yyyyMMdd)$(rev:.r)
resources:
  repositories:
  - repository: self
    type: git
    ref: feature/add-functional-tests
jobs:
- job: Job_1
  displayName: Agent job 1
  pool:
    vmImage: ubuntu-16.04
  steps:
  - checkout: self
  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: $(BuildParameters.RestoreBuildProjects)
  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      projects: $(BuildParameters.RestoreBuildProjects)
      arguments: --configuration $(BuildConfiguration)
  - task: DotNetCoreCLI@2
    displayName: Run 1st-Priority Tests
    continueOnError: True
    inputs:
      command: test
      projects: $(BuildParameters.TestProjects)
      arguments: --configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --logger "console;verbosity=detailed" --filter "Priority=1"
  - task: DotNetCoreCLI@2
    displayName: Run 2nd-Priority Tests
    continueOnError: True
    enabled: False
    inputs:
      command: test
      projects: $(BuildParameters.TestProjects)
      arguments: --configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --logger "console;verbosity=detailed" --filter "Priority=2"
  - task: DotNetCoreCLI@2
    displayName: Run 3rd-Priority Tests
    continueOnError: True
    enabled: False
    inputs:
      command: test
      projects: $(BuildParameters.TestProjects)
      arguments: --configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --logger "console;verbosity=detailed" --filter "Priority=3"
  - task: DotNetCoreCLI@2
    displayName: Run 4th-Priority Tests
    continueOnError: True
    enabled: False
    inputs:
      command: test
      projects: $(BuildParameters.TestProjects)
      arguments: --configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --logger "console;verbosity=detailed" --filter "Priority=4"
  - task: DotNetCoreCLI@2
    displayName: Run 5th-Priority Tests
    continueOnError: True
    enabled: False
    inputs:
      command: test
      projects: $(BuildParameters.TestProjects)
      arguments: --configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --logger "console;verbosity=detailed" --filter "Priority=5"
  - task: DotNetCoreCLI@2
    displayName: Run Most Simple Test
    enabled: False
    inputs:
      command: test
      projects: $(BuildParameters.TestProjects)
      arguments: --configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --logger "console;verbosity=detailed" --filter "IsMostSimpleTest=True" -- RunConfiguration.DisableAppDomain=true
  - task: DotNetCoreCLI@2
    displayName: Install ReportGenerator tool
    continueOnError: True
    inputs:
      command: custom
      custom: tool
      arguments: install --global dotnet-reportgenerator-globaltool --version 4.8.7
  - task: CmdLine@2
    displayName: Command Line Script
    continueOnError: True
    inputs:
      script: reportgenerator -reports:$(Agent.TempDirectory)/**/coverage.cobertura.xml -targetdir:$(Build.SourcesDirectory)/coverlet/reports -reporttypes:"Cobertura"
  - task: PublishCodeCoverageResults@1
    displayName: Publish code coverage
    continueOnError: True
    inputs:
      codeCoverageTool: Cobertura
      summaryFileLocation: $(Build.SourcesDirectory)/coverlet/reports/Cobertura.xml
  - task: DotNetCoreCLI@2
    displayName: Publish
    continueOnError: True
    inputs:
      command: publish
      publishWebProjects: True
      projects: $(BuildParameters.RestoreBuildProjects)
      arguments: --configuration $(BuildConfiguration) --output $(build.artifactstagingdirectory)
      zipAfterPublish: True
  - task: PublishBuildArtifacts@1
    displayName: Publish Artifact
    condition: succeededOrFailed()
    continueOnError: True
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      TargetPath: '\\my\share\$(Build.DefinitionName)\$(Build.BuildNumber)'
...
